# Reroute — full local stack.
#   cp .env.example .env
#   docker compose up -d --build                          # everything
#   docker compose up -d sqlserver redis kafka kafka-init rabbitmq keycloak qdrant elasticsearch   # infra only
# Then: cd web && npm run dev  →  http://localhost:5173  (login: traveller / traveller)

x-dotnet-service: &dotnet-service
  restart: unless-stopped
  environment: &dotnet-env
    ASPNETCORE_ENVIRONMENT: Docker
    Auth__Authority: http://keycloak:8080/realms/reroute
    Kafka__BootstrapServers: kafka:29092
    ConnectionStrings__Redis: redis:6379
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  depends_on: &dotnet-deps
    redis: { condition: service_healthy }
    kafka-init: { condition: service_completed_successfully }
    keycloak: { condition: service_healthy }
  deploy:
    resources:
      limits: { memory: 512M }

services:
  # ---------------------------------------------------------------- infrastructure
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    ports: ["1433:1433"]
    volumes: [sqldata:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  kafka:
    image: apache/kafka:3.9.1   # KRaft mode — no ZooKeeper
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created explicitly (kafka-init) — no typos in prod
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in flight-status.raw.v1 disruption.detected.v1 itinerary.events.v1 claims.events.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t.dlq --partitions 1 --replication-factor 1
        done
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:29092 --alter --entity-type topics --entity-name itinerary.events.v1 --add-config cleanup.policy=compact

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8085:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on: [kafka]

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"   # local only
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [esdata:/usr/share/elasticsearch/data]
    deploy: { resources: { limits: { memory: 1G } } }

  qdrant:
    image: qdrant/qdrant:v1.15.0
    ports: ["6333:6333", "6334:6334"]
    volumes: [qdrantdata:/qdrant/storage]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # One issuer for browser AND containers: browser uses localhost:8081, services use keycloak:8080 (backchannel).
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["8081:8080"]
    volumes: [./deploy/keycloak:/opt/keycloak/data/import:ro]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["8025:8025", "1025:1025"]

  # ---------------------------------------------------------------- observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: [./deploy/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro]
    ports: ["4317:4317", "4318:4318"]
    depends_on: [tempo, loki]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver", "--enable-feature=exemplar-storage"]
    volumes:
      - ./deploy/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: [./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro]

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/local-config.yaml"]

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, tempo, loki]

  # ---------------------------------------------------------------- application
  gateway:
    <<: *dotnet-service
    build: { context: ., dockerfile: src/Gateway/Reroute.Gateway/Dockerfile }
    ports: ["8080:8080"]
    environment:
      <<: *dotnet-env
      Oidc__Authority: http://keycloak:8080/realms/reroute
      Oidc__ClientSecret: ${BFF_CLIENT_SECRET}
      ReverseProxy__Clusters__claims__Destinations__d1__Address: http://claims-api:8080
      ReverseProxy__Clusters__disruption__Destinations__d1__Address: http://disruption-api:8080
      ReverseProxy__Clusters__copilot__Destinations__d1__Address: http://copilot-api:8080
      ReverseProxy__Clusters__search__Destinations__d1__Address: http://search-api:8080
      ReverseProxy__Clusters__notification__Destinations__d1__Address: http://notification-api:8080

  claims-api:
    <<: *dotnet-service
    build: { context: ., dockerfile: src/Services/Claims/Reroute.Claims.Api/Dockerfile }
    environment:
      <<: *dotnet-env
      ConnectionStrings__ClaimsDb: Server=sqlserver,1433;Database=claims;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True
    depends_on:
      <<: *dotnet-deps
      sqlserver: { condition: service_healthy }

  disruption-api:
    <<: *dotnet-service
    build: { context: ., dockerfile: src/Services/Disruption/Reroute.Disruption.Api/Dockerfile }
    environment:
      <<: *dotnet-env
      Simulator__Enabled: "true"
      Simulator__EventsPerSecond: "5"

  notification-api:
    <<: *dotnet-service
    build: { context: ., dockerfile: src/Services/Notification/Reroute.Notification.Api/Dockerfile }
    environment:
      <<: *dotnet-env
      RabbitMq__Host: rabbitmq
      Smtp__Host: mailpit
    depends_on:
      <<: *dotnet-deps
      rabbitmq: { condition: service_healthy }

  copilot-api:
    <<: *dotnet-service
    build: { context: ., dockerfile: src/Services/Copilot/Reroute.Copilot.Api/Dockerfile }
    environment:
      <<: *dotnet-env
      Qdrant__Host: qdrant
      Services__Claims: http://claims-api:8080
      AI__Provider: ${AI_PROVIDER:-Fake}
      AI__ApiKey: ${AI_API_KEY:-}
      AI__Endpoint: ${AI_ENDPOINT:-}

  search-api:
    <<: *dotnet-service
    build: { context: ., dockerfile: src/Services/Search/Reroute.Search.Api/Dockerfile }
    environment:
      <<: *dotnet-env
      Elasticsearch__Url: http://elasticsearch:9200
      AI__Provider: ${AI_PROVIDER:-Fake}
      AI__ApiKey: ${AI_API_KEY:-}
      AI__Endpoint: ${AI_ENDPOINT:-}
      AI__EmbeddingDimensions: "1536"

volumes:
  sqldata:
  esdata:
  qdrantdata:
