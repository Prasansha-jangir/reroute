name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # superseded pushes don't waste runner minutes

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: ['src/**', 'tests/**', '*.props', 'global.json', 'Reroute.slnx']
            web: ['web/**']
            infra: ['deploy/**', 'infra/**', 'docker-compose.yml']

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write          # test report annotations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'
      - run: dotnet restore Reroute.slnx --locked-mode || dotnet restore Reroute.slnx
      - name: Build (warnings as errors)
        run: dotnet build Reroute.slnx --no-restore -c Release
      - name: Vulnerable packages gate
        run: |
          dotnet list Reroute.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          ! grep -qE "(High|Critical)" vuln.txt
      - name: Unit + architecture tests
        run: |
          for p in tests/Reroute.Claims.UnitTests tests/Reroute.Disruption.UnitTests tests/Reroute.Copilot.UnitTests tests/Reroute.ArchitectureTests; do
            dotnet test --project "$p" -c Release --no-build --report-trx --coverage --coverage-output-format cobertura --results-directory TestResults
          done
      # GitHub-hosted Ubuntu runners ship Docker → Testcontainers starts a REAL SQL Server.
      - name: Integration tests (Testcontainers)
        run: dotnet test --project tests/Reroute.Claims.IntegrationTests -c Release --no-build --report-trx --results-directory TestResults
      - uses: dorny/test-reporter@v1
        if: always()
        with:
          name: .NET tests
          path: TestResults/**/*.trx
          reporter: dotnet-trx
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: dotnet-test-results, path: TestResults }

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run --coverage.enabled=false
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: web/dist }

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bicep
        run: az bicep build --file infra/azure/main.bicep --stdout > /dev/null
      - name: Validate Kubernetes manifests (kustomize + kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for overlay in dev prod; do
            kubectl kustomize deploy/k8s/overlays/$overlay | ./kubeconform -strict -summary -ignore-missing-schemas
          done
      - name: Validate docker-compose
        run: cp .env.example .env && docker compose config -q

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: 'csharp, javascript-typescript', build-mode: none }
      - uses: github/codeql-action/analyze@v3
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with: { fail-on-severity: high }
