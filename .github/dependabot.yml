version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    groups:
      opentelemetry: { patterns: ['OpenTelemetry*'] }
      microsoft: { patterns: ['Microsoft.*', 'System.*'] }
    ignore:
      # Licence boundaries: MassTransit v9+ is commercial.
      - dependency-name: 'MassTransit*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      react: { patterns: ['react', 'react-dom', '@types/react*'] }
      testing: { patterns: ['vitest', '@testing-library/*', 'msw', 'jsdom', '@playwright/test'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /src/Services/Claims/Reroute.Claims.Api
    schedule: { interval: weekly }
