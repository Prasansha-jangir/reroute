# Zero-trust inside the cluster: deny everything, then allow only the edges in the architecture diagram.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny }
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: gateway-from-ingress }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: services-from-gateway }
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [claims-api, disruption-api, notification-api, copilot-api, search-api] }
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: gateway } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: claims-from-copilot }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: claims-api } }
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: copilot-api } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: metrics-from-monitoring }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/part-of: reroute } }
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
      ports: [{ port: 8080 }]
