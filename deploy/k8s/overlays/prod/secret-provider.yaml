# Azure Key Vault → Kubernetes Secret via the Secrets Store CSI driver, authenticated with Workload Identity.
# No secret values ever live in Git or in the pipeline.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: reroute-kv
spec:
  provider: azure
  parameters:
    clientID: REPLACE_WORKLOAD_IDENTITY_CLIENT_ID
    keyvaultName: reroute-kv
    tenantId: REPLACE_TENANT_ID
    objects: |
      array:
        - |
          objectName: claims-db
          objectType: secret
        - |
          objectName: eventhubs-connection
          objectType: secret
        - |
          objectName: servicebus-connection
          objectType: secret
        - |
          objectName: openai-api-key
          objectType: secret
  secretObjects:
    - secretName: claims-secrets
      type: Opaque
      data:
        - { objectName: claims-db, key: claims-db }
    - secretName: notification-api-secrets
      type: Opaque
      data:
        - { objectName: servicebus-connection, key: ConnectionStrings__ServiceBus }
        - { objectName: eventhubs-connection, key: Kafka__SaslPassword }
    - secretName: copilot-api-secrets
      type: Opaque
      data:
        - { objectName: openai-api-key, key: AI__ApiKey }
