global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

# Metrics arrive two ways: OTLP → collector → remote-write (above), and direct scrape of /metrics (below).
# Scraping is kept as a fallback and to demonstrate the pull model; in K8s, pod annotations drive discovery.
scrape_configs:
  - job_name: reroute-services
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:8080", "claims-api:8080", "disruption-api:8080", "notification-api:8080", "copilot-api:8080", "search-api:8080"]
